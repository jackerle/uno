<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070814" />
    <meta name="description" content="Play UNO online with friends — real-time multiplayer card game for 2 to 8 players." />
    <title>UNO Online</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/cards.css" />
    <link rel="stylesheet" href="/css/lobby.css" />
    <link rel="stylesheet" href="/css/game.css" />
    <link rel="stylesheet" href="/css/overlays.css" />
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="grain" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="fx-layer" aria-hidden="true"></div>
    <div id="overlay-root"></div>
    <div id="conn-banner" role="alert" hidden><span class="spinner"></span><span class="conn-text">Connection lost — reconnecting…</span></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="sr-live" class="sr-only" aria-live="polite"></div>
    <noscript><p class="noscript">UNO Online needs JavaScript to run.</p></noscript>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
